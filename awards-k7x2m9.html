<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>移動サロン2026 クイズ選手権 表彰式</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
    background: radial-gradient(circle at 70% 20%, rgba(88,215,255,.14), transparent 40%),
                linear-gradient(145deg, #071225, #102A52 70%, #123E54);
    color: #fff; overflow: hidden; user-select: none;
  }
  #confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
  .stage { position: relative; z-index: 10; height: 100%; display: flex; flex-direction: column;
           align-items: center; justify-content: center; text-align: center; padding: 4vh 5vw; cursor: pointer; }
  .kicker { color: #B9F36B; font-size: clamp(14px, 2vw, 24px); font-weight: 800; letter-spacing: .2em; }
  h1 { font-size: clamp(34px, 6.5vw, 92px); line-height: 1.3; margin: 2vh 0; letter-spacing: .02em; }
  .sub { color: #C4D5E9; font-size: clamp(16px, 2.2vw, 30px); line-height: 1.8; }
  .hint { position: fixed; bottom: 3vh; left: 0; right: 0; text-align: center;
          color: rgba(255,255,255,.45); font-size: clamp(12px, 1.4vw, 18px); z-index: 20; }
  .quote { background: rgba(255,255,255,.07); border-left: 8px solid #58D7FF; border-radius: 12px;
           padding: 3vh 3vw; margin: 1.2vh 0; text-align: left; max-width: 1100px;
           font-size: clamp(18px, 2.6vw, 36px); line-height: 1.7; }
  .quote small { display: block; color: #9EB1C9; font-size: clamp(12px, 1.4vw, 18px); margin-top: .6vh; }
  .award-tag { display: inline-block; border: 3px solid; border-radius: 999px;
               padding: 1vh 4vw; font-size: clamp(22px, 3.4vw, 48px); font-weight: 900; letter-spacing: .1em; }
  .gold   { color: #FFD75E; border-color: #FFD75E; text-shadow: 0 0 30px rgba(255,215,94,.5); }
  .silver { color: #DDE7F2; border-color: #DDE7F2; }
  .bronze { color: #F0A868; border-color: #F0A868; }
  .green  { color: #B9F36B; border-color: #B9F36B; }
  .winner { font-size: clamp(52px, 11vw, 160px); font-weight: 900; line-height: 1.25; margin: 3vh 0;
            text-shadow: 0 6px 40px rgba(0,0,0,.5); }
  .winner.rolling { color: #9EB1C9; }
  .winner.revealed { animation: pop .6s cubic-bezier(.2, 1.6, .3, 1); }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .score { font-size: clamp(22px, 3.6vw, 52px); color: #FFD75E; font-weight: 800; }
  .bignum { font-size: clamp(80px, 16vw, 240px); font-weight: 900; color: #58D7FF;
            text-shadow: 0 0 60px rgba(88,215,255,.6); line-height: 1.2; }
  /* 設定パネル */
  #setup { position: fixed; inset: 0; z-index: 100; background: rgba(4,10,22,.97);
           display: flex; align-items: center; justify-content: center; }
  .panel { width: min(92vw, 760px); background: #0E2141; border: 1px solid #2c4a7c; border-radius: 16px; padding: 28px; }
  .panel h2 { font-size: 22px; margin-bottom: 14px; }
  .panel p { font-size: 14px; color: #C4D5E9; margin-bottom: 8px; line-height: 1.7; }
  .panel textarea { width: 100%; height: 200px; background: #071225; color: #fff; border: 1px solid #2c4a7c;
                    border-radius: 10px; padding: 10px; font-size: 13px; font-family: Consolas, monospace; }
  .panel input { width: 200px; background: #071225; color: #fff; border: 1px solid #2c4a7c;
                 border-radius: 10px; padding: 10px; font-size: 18px; margin-top: 6px; }
  .panel button { display: block; width: 100%; margin-top: 16px; padding: 14px; border: 0; border-radius: 12px;
                  font-family: inherit; font-size: 18px; font-weight: 900; cursor: pointer;
                  color: #071225; background: linear-gradient(135deg, #58D7FF, #B9F36B); }
  .panel .err { color: #FF9D9D; font-size: 14px; margin-top: 8px; min-height: 1.2em; }
</style>
</head>
<body>

<div id="setup">
  <div class="panel">
    <h2>🏆 表彰式セットアップ（幹事用・投影前にどうぞ）</h2>
    <p>① スプレッドシートの「ランキング」シートで、<strong>3行目から最終行まで（A〜B列以降まるごとでOK）</strong>を選択してコピーし、下に貼り付け：</p>
    <textarea id="dataIn" placeholder="こだまとしふみ	20	65	1784961991171&#10;飯村	19	51	1784965290472&#10;（シートからそのまま貼り付け）"></textarea>
    <p style="margin-top:12px">② ニアピンの正解（ランキングシートの B1 の数字）：</p>
    <input id="nearpinIn" inputmode="numeric" placeholder="例: 435">
    <button onclick="start()">表彰式をはじめる 🎉</button>
    <div class="err" id="setupErr"></div>
  </div>
</div>

<canvas id="confetti"></canvas>
<div class="stage" id="stage" onclick="advance()"></div>
<div class="hint" id="hint">クリック / スペースキーで進みます</div>

<script>
"use strict";

/* ---------- データ ---------- */
var ranking = [];   // {name, score, diff}
var nearpin = 0;

function start() {
  var lines = document.getElementById("dataIn").value.trim().split(/\r?\n/);
  ranking = [];
  for (var i = 0; i < lines.length; i++) {
    var cols = lines[i].split(/\t/);
    if (cols.length < 2) cols = lines[i].trim().split(/\s{1,}/);
    if (cols.length < 2) continue;
    var name = cols[0].trim();
    var score = parseInt(cols[1], 10);
    if (!name || isNaN(score)) continue;
    if (name === "名前") continue;
    ranking.push({ name: name, score: score, diff: cols.length > 2 ? cols[2].trim() : "" });
  }
  nearpin = parseInt(document.getElementById("nearpinIn").value, 10);
  if (ranking.length < 2) { document.getElementById("setupErr").textContent = "ランキングを2人以上貼り付けてください"; return; }
  if (isNaN(nearpin)) { document.getElementById("setupErr").textContent = "ニアピンの正解(B1の数字)を入れてください"; return; }
  document.getElementById("setup").style.display = "none";
  buildSlides();
  show(0);
}

/* ---------- スライド構成 ---------- */
var slides = [];
var idx = -1;
var busy = false;

function buildSlides() {
  var total = ranking.length;
  slides = [
    { html: '<div class="kicker">IDO-SALON 2026 TSUKUBA</div><h1>🏆 クイズ選手権<br>表彰式</h1><div class="sub">全' + total + '名がエントリー。栄光は誰の手に——</div>' },
    { html: '<div class="kicker">MAKING OF</div><h1>この選手権、<br>AIと一緒に作りました</h1><div class="sub">幹事がAIに出した「実際の注文」をちょっとだけ公開</div>' },
    { html: '<div class="kicker">実際の注文 その1</div>' +
        '<div class="quote">「クイズは<strong>現地の展示を見ないと答えられない</strong>問題にして。バスでは予習だけ、答えは展示の中に」<small>→ 全20問の答えを、公式サイトとJAXAのパンフレットまで調べて仕込みました</small></div>' +
        '<div class="quote">「挿絵は全部<strong>“ゆるふわ”</strong>で統一。画像生成AI(gpt-image-2)で描いて」<small>→ 22枚のイラストをAIが描き分けました</small></div>' },
    { html: '<div class="kicker">実際の注文 その2</div>' +
        '<div class="quote">「答え合わせは<strong>エントリー送信後のお楽しみ</strong>に。送信したら回答はロック」</div>' +
        '<div class="quote">「成績は<strong>サーバーに直接送信</strong>。改ざんは<strong>チェックコード</strong>で自動検知」<small>→ 今日の全エントリー、検証はぜんぶ通過済みです</small></div>' +
        '<div class="quote">「同点は<strong>ニアピン問題</strong>で決着」<small>→ というわけで、まずはその正解発表から！</small></div>' },
    { pre: '<div class="kicker">NEARPIN ANSWER</div><h1>🎯 ニアピン問題</h1><div class="sub">「今日の参加者全員の正解数を合計すると？」<br><br>タップで正解発表！</div>',
      reveal: function () { return '<div class="kicker">NEARPIN ANSWER</div><h1>🎯 正解は……</h1><div class="bignum">' + nearpin + '点</div><div class="sub">全員の健闘の合計です。拍手！👏</div>'; }, confetti: true }
  ];
  var awards = [];
  if (total >= 3) awards.push({ tag: "第3位", cls: "bronze", row: ranking[2] });
  if (total >= 4) awards.push({ tag: "チャレンジ賞", cls: "green", row: ranking[total - 1], note: "最後まで挑んだあなたが主役！" });
  if (total >= 2) awards.push({ tag: "第2位", cls: "silver", row: ranking[1] });
  awards.push({ tag: "優勝", cls: "gold", row: ranking[0] });
  for (var i = 0; i < awards.length; i++) slides.push(makeAward(awards[i]));
  slides.push({ html: '<div class="kicker">THANK YOU</div><h1>🚌 移動サロン2026<br>おつかれさまでした！</h1><div class="sub">つくばの科学も、クイズも、そしてこの後の宴も。<br>ご参加ありがとうございました🍻</div>', confetti: true });
}

function makeAward(a) {
  return {
    pre: '<div class="award-tag ' + a.cls + '">' + a.tag + '</div><h1>発表します</h1><div class="sub">' + (a.note || "……いったい誰だ？") + '<br><br>タップでドラムロール🥁</div>',
    roll: true,
    reveal: function () {
      return '<div class="award-tag ' + a.cls + '">' + a.tag + '</div>' +
             '<div class="winner revealed">' + esc(a.row.name) + '</div>' +
             '<div class="score">' + a.row.score + '/20問正解' + (a.row.diff !== "" ? '｜ニアピン差 ' + esc(a.row.diff) : '') + '</div>';
    },
    confetti: true
  };
}

function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

/* ---------- 進行 ---------- */
var stagePhase = 0; /* 0=pre表示中(要タップで演出) */

function show(i) {
  idx = i;
  var s = slides[idx];
  stagePhase = s.pre ? 0 : 1;
  document.getElementById("stage").innerHTML = s.pre || s.html;
}

function advance() {
  if (busy) return;
  var s = slides[idx];
  if (s && s.pre && stagePhase === 0) {
    /* 演出フェーズ */
    stagePhase = 1;
    if (s.roll) return drumroll(s);
    document.getElementById("stage").innerHTML = s.reveal();
    if (s.confetti) burst();
    return;
  }
  if (idx < slides.length - 1) show(idx + 1);
}

function drumroll(s) {
  busy = true;
  var names = ranking.map(function (r) { return r.name; });
  var el = document.getElementById("stage");
  el.innerHTML = '<div class="winner rolling" id="roller">？？？</div>';
  var roller = document.getElementById("roller");
  var t = 0, interval = 70, t0 = Date.now(), duration = 2600;
  (function spin() {
    roller.textContent = names[t % names.length];
    t++;
    var elapsed = Date.now() - t0; /* 実時間基準(タブが裏でタイマーが間引かれても2.6秒で必ず終わる) */
    interval = 70 + Math.pow(Math.min(elapsed / duration, 1), 2) * 320; /* だんだん減速 */
    if (elapsed < duration) setTimeout(spin, interval);
    else {
      el.innerHTML = s.reveal();
      if (s.confetti) burst();
      busy = false;
    }
  })();
}

document.addEventListener("keydown", function (e) {
  if (e.key === " " || e.key === "Enter" || e.key === "ArrowRight") { e.preventDefault(); advance(); }
  if (e.key === "ArrowLeft" && idx > 0 && !busy) show(idx - 1);
});

/* ---------- 紙吹雪 ---------- */
var cv = document.getElementById("confetti"), cx = cv.getContext("2d"), parts = [];
function fit() { cv.width = innerWidth; cv.height = innerHeight; }
fit(); addEventListener("resize", fit);
var COLORS = ["#FFD75E", "#58D7FF", "#B9F36B", "#FF8FA3", "#F0A868", "#ffffff"];
function burst() {
  for (var i = 0; i < 260; i++) {
    parts.push({
      x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * .5,
      w: 7 + Math.random() * 8, h: 10 + Math.random() * 10,
      vy: 2.4 + Math.random() * 3.4, vx: -1.6 + Math.random() * 3.2,
      rot: Math.random() * Math.PI, vr: -.14 + Math.random() * .28,
      c: COLORS[(Math.random() * COLORS.length) | 0]
    });
  }
}
(function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  for (var i = parts.length - 1; i >= 0; i--) {
    var p = parts[i];
    p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    if (p.y > cv.height + 30) { parts.splice(i, 1); continue; }
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot);
    cx.fillStyle = p.c; cx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    cx.restore();
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
